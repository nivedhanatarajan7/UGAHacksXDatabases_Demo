<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGAHacksX Databases Demo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <h1>Grocery List</h1>
    <p>Add items to your grocery list. Enter in the name of the item and the count you would like to buy.</p>
    <form id="addform">
        <h2>Add Grocery Items</h2>
        <div id="fields">
            <label>Grocery Item</label>
            <input required type="text" id="name" placeholder="Ex. Carrots">

            <label>Item Count</label>
            <input required type="number" id="count" placeholder="Ex. 10">
        </div>
        <button type="submit">Add Item</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        function sendData(event) {
            event.preventDefault();
            const name = document.getElementById('name').value.trim();
            const count = document.getElementById('count').value;

            if (!name || count <= 0) {
                alert("Please enter a valid item name and count.");
                return;
            }

            axios.post('http://localhost:8082/api/items/', {
                itemName: name,
                itemCount: count
            })
            .then(response => {
                console.log("Data sent successfully:", response.data);
                alert("Item added successfully!");
                document.getElementById('addform').reset(); // Clear form
            })
            .catch(error => {
                console.error("Data not sent:", error);
                alert("Failed to add item. Please try again.");
            });
        }

        document.getElementById('addform').addEventListener('submit', sendData);
    </script>
</body>
</html>
